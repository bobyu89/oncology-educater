# 把學習手冊的網頁版發布到 GitHub Pages。
# 每次推到 main：檢查章節 → 建置網頁 → 把建置結果推到 gh-pages 分支。
# GitHub Pages 設定為「Deploy from a branch：gh-pages」，分支更新後會自動重新發布。
name: Publish handbook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "handbook/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: pip install markdown
      - name: Check chapters
        run: python tools/lint_chapter.py --all --quiet-warn
      - name: Build site
        run: python tools/build_site.py
      - name: Push the built site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp site/index.html _site/index.html
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site built from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
